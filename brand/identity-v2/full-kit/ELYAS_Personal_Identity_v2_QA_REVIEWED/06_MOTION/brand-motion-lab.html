<h2>إظهار وإخفاء الطبقات</h2><div id="layers"></div>
<small>النسخة المفصلة مصممة لتجربة حركة القطع المستقلة. هذا المختبر لا يحتاج اتصالًا بالشبكة. تُحترم إعدادات تقليل الحركة في الجهاز.</small>
</main><script>
const state={fine:false,dark:false,duration:650};
const stage=document.querySelector('#stage');
const getSvg=()=>document.querySelector(state.fine?'#fine svg':'#basic svg');
const basic=['group-E','group-L','group-Y','group-A','group-S','part-signature-sweep','part-signature-slash-1','part-signature-slash-2','group-surname'];
const fine=['rig-E-upper','rig-E-lower','rig-E-inlay','rig-L','rig-Y','rig-A','rig-S','rig-signature-sweep','rig-signature-slash-1','rig-signature-slash-2','rig-surname'];
function getNode(id){return Array.from(getSvg().querySelectorAll('[id]')).find(el=>el.id===id)}
function rebuildChecks(){
 const ids=state.fine?fine:basic;
 document.querySelector('#layers').innerHTML='';
 ids.forEach(id=>{
 const label=document.createElement('label'),check=document.createElement('input');
 check.type='checkbox';check.checked=true;check.setAttribute('aria-label','إظهار '+id);
 check.onchange=()=>{const node=getNode(id);if(node){node.getAnimations().forEach(a=>a.cancel());node.style.display=check.checked?'':'none'}}
 label.append(check,document.createTextNode(' '+id));document.querySelector('#layers').append(label);
 });
}
function recolor(){
 for(const svg of document.querySelectorAll('.stage svg')){
  for(const el of svg.querySelectorAll('path')){
   const original=el.dataset.originalFill||el.getAttribute('fill');
   el.dataset.originalFill=original;
   if(original==='#0D4B52'||original==='#F6EFE6')el.setAttribute('fill',state.dark?'#F6EFE6':'#0D4B52');
  }
 }
 stage.classList.toggle('dark',state.dark);
}
function play(){
 const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 const ids=state.fine?fine:basic;
 ids.forEach((id,i)=>{const node=getNode(id);if(!node)return;
 node.getAnimations().forEach(a=>a.cancel()); if(reduced)return;
 node.animate([{opacity:0,transform:'translateY(7px)'},{opacity:1,transform:'translateY(0px)'}],
 {duration:state.duration,delay:i*90,fill:'both',easing:'cubic-bezier(.21,.75,.25,1)'});
 });
}
document.querySelector('#play').onclick=play;
document.querySelector('#mode').onclick=()=>{
 state.fine=!state.fine;document.querySelector('#basic').classList.toggle('hidden',state.fine);
 document.querySelector('#fine').classList.toggle('hidden',!state.fine);
 document.querySelector('#mode').textContent=state.fine?'العودة للشعار الأساسي':'التبديل إلى النسخة المفصلة';
 rebuildChecks();play();
};
document.querySelector('#background').onclick=()=>{
 state.dark=!state.dark;recolor();
 document.querySelector('#background').textContent=state.dark?'الخلفية الفاتحة':'الخلفية الداكنة';
};
document.querySelector('#duration').oninput=e=>{
 state.duration=Number(e.target.value);document.querySelector('#ms').textContent=state.duration+'ms';
};
rebuildChecks();recolor();play();
</script></body></html>
