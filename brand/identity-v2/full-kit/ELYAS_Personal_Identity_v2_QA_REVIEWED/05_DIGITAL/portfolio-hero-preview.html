<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELYAS AL SHAEBI | Portfolio UI preview</title>
<link rel="stylesheet" href="../10_DEVELOPER/elyas-brand.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--brand-bg);color:var(--brand-ink);font-family:'Noto Sans Arabic',sans-serif;transition:background .2s,color .2s}header{max-width:1240px;margin:auto;padding:24px;display:flex;align-items:center;justify-content:space-between}header img{width:180px}nav{display:flex;gap:24px}a{color:inherit;text-decoration:none}button{cursor:pointer;font:inherit;border:0;border-radius:10px;padding:12px 20px;background:var(--brand-ink);color:var(--brand-bg)}.hero{max-width:1240px;padding:8vw 24px;margin:auto;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:30px}.eyebrow{color:var(--elyas-copper);font-weight:800;letter-spacing:1.3px}h1{font-size:clamp(38px,5.7vw,84px);line-height:1.28;letter-spacing:-1px;margin:12px 0}p{line-height:1.9;color:var(--brand-ink);opacity:.85}.art{height:400px;background:linear-gradient(140deg,transparent 20%,#DCE6E2 20%,#DCE6E2 56%,var(--elyas-copper) 56%,var(--elyas-copper) 61%,var(--brand-ink) 61%);border-radius:28px;position:relative}.logo{position:absolute;left:10%;top:40%;width:70%;background:var(--brand-bg);border-radius:13px;padding:20px}.btns{display:flex;gap:15px;flex-wrap:wrap}@media(max-width:700px){nav{display:none}.hero{grid-template-columns:1fr}.art{height:280px}}</style></head><body><header><img src="../02_LOGOS/primary-flat-1200.png" alt="ELYAS"/><nav><a href="#">الرئيسية</a><a href="#">المشاريع</a><a href="#">عني</a><a href="#">تواصل</a></nav><button id="theme">الوضع الداكن</button></header><main class="hero"><div><div class="eyebrow">SOFTWARE ENGINEER</div><h1>أصمّم حلولًا رقمية<br>بفكر هندسي.</h1><p>إلياس الشعيبي — مهندس برمجيات أعمل على تحويل الأفكار إلى أنظمة واضحة وتجارب موثوقة.</p><div class="btns"><button>استكشف أعمالي</button><button style="border:1px solid var(--brand-ink);background:transparent;color:var(--brand-ink)">تواصل معي</button></div></div><div class="art"><img class="logo" src="../02_LOGOS/primary-flat-1200.png"></div></main><script>document.querySelector('#theme').onclick=()=>{document.body.dataset.theme=document.body.dataset.theme==='dark'?'':'dark';document.querySelector('#theme').innerText=document.body.dataset.theme?'الوضع الفاتح':'الوضع الداكن';}</script></body></html>
