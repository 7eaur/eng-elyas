<!-- Copy folder public/brand/ to the site's public/brand/ directory -->
<!-- Add to <head> (replace YOUR_HTTPS_DOMAIN.example with the real public domain): -->
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
<link rel="icon" type="image/x-icon" href="/brand/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/brand/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" sizes="180x180">
<link rel="manifest" href="/brand/site.webmanifest">
<meta name="theme-color" content="#0D4B52">
<meta property="og:type" content="website">
<meta property="og:image" content="https://YOUR_HTTPS_DOMAIN.example/brand/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://YOUR_HTTPS_DOMAIN.example/brand/og-image.jpg">
